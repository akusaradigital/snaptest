name: Keep Services Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Neon (via app health)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            curl -fsS --max-time 20 "$APP_URL/api/health" || true
          fi

      - name: Ping Railway crawler
        env:
          CRAWLER_URL: ${{ secrets.CRAWLER_URL }}
        run: |
          if [ -n "$CRAWLER_URL" ]; then
            curl -fsS --max-time 20 "$CRAWLER_URL/health" || true
          fi